# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Create _site directory and copy httrack files
        run: |
          # Create _site directory
          mkdir -p _site
          # Copy the httrack backup to _site
          cp -r lacunafund-httrack-backup/lacunafund.org/* _site/
          
      - name: Run banner deployment
        run: |
          # Install BeautifulSoup
          pip install beautifulsoup4
          # Run the banner deployment script
          python deploy_banner_manager.py --directory _site
          
      - name: Create root index.html file
        run: |
          echo '<!DOCTYPE html>' > _site/index.html
          echo '<html>' >> _site/index.html
          echo '<head>' >> _site/index.html
          echo '  <meta charset="UTF-8">' >> _site/index.html
          echo '  <title>Lacuna Fund Backup</title>' >> _site/index.html
          echo '  <style>' >> _site/index.html
          echo '    body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }' >> _site/index.html
          echo '    .container { max-width: 800px; margin: 0 auto; }' >> _site/index.html
          echo '  </style>' >> _site/index.html
          echo '</head>' >> _site/index.html
          echo '<body>' >> _site/index.html
          echo '  <div class="container">' >> _site/index.html
          echo '    <h1>Lacuna Fund Backup Site</h1>' >> _site/index.html
          echo '    <p>This is a backup of the Lacuna Fund website.</p>' >> _site/index.html
          echo '    <p>If you are not redirected automatically, please <a href="index.html">click here</a>.</p>' >> _site/index.html
          echo '  </div>' >> _site/index.html
          echo '</body>' >> _site/index.html
          echo '</html>' >> _site/index.html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the _site directory containing our website files
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4